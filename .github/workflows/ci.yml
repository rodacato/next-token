name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run i18n:check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The bench runs on recorded runs here; no model is downloaded in CI.
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  # Dojo's scroll conformance suite, run against the production build.
  conformance:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rodacato/dojo
          path: .dojo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .dojo/package.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the conformance suite
        working-directory: .dojo
        run: |
          pnpm install --frozen-lockfile --filter "@dojo/scroll-conformance..."
          pnpm --filter "@dojo/scroll-conformance..." build
      - run: npm run build
      - name: Run the suite
        run: |
          npx vite preview --port 5340 --strictPort &
          for attempt in $(seq 30); do curl -sf http://localhost:5340/index.html > /dev/null && break; sleep 1; done
          node .dojo/packages/scroll-conformance/dist/bin.js --url http://localhost:5340/index.html --drive tests/conformance/drive.mjs
