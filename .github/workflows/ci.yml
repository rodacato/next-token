name: CI · Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run i18n:check
      - run: npm run build

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The bench runs on recorded runs here; no model is downloaded in CI.
      - run: npm run test:e2e:smoke
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-traces
          path: test-results/

  # Dojo's scroll conformance suite, run against the production build.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rodacato/dojo
          path: .dojo
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .dojo/package.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the conformance suite
        working-directory: .dojo
        run: |
          pnpm install --frozen-lockfile --filter "@dojo/scroll-conformance..."
          pnpm --filter "@dojo/scroll-conformance..." build
      - run: npm run build
      - name: Run the suite
        run: |
          npx vite preview --port 5340 --strictPort &
          for _ in $(seq 30); do curl -sf http://localhost:5340/index.html > /dev/null && break; sleep 1; done
          node .dojo/packages/scroll-conformance/dist/bin.js --url "http://localhost:5340/index.html?walkthrough=off" --drive tests/conformance/drive.mjs
